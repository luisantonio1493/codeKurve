[package]
name = "codekurve-bin"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "codekurve"
path = "src/main.rs"

[dependencies]
codekurve = { path = "../codekurve" }
codekurve-core = { path = "../codekurve-core" }
codekurve-mcp = { path = "../codekurve-mcp" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
codekurve-store = { path = "../codekurve-store" }
