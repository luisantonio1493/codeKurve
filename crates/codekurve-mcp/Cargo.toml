[package]
name = "codekurve-mcp"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
codekurve = { path = "../codekurve" }
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
codekurve-core = { path = "../codekurve-core" }
codekurve-store = { path = "../codekurve-store" }
