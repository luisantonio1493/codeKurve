name: Release

# Builds binaries + SBOM + license report + checksums, uploads them as
# GitHub Actions workflow artifacts (`bundle` job), and — only when the run
# was triggered by a `v*` tag push — publishes that same bundle as a public
# GitHub Release via `gh release create` (`publish` job). A bare
# `workflow_dispatch` run (no tag) still builds and bundles but never
# publishes, so ad-hoc runs can't accidentally cut a release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least privilege: every job gets a read-only token; only `publish` (the one
# job that creates the GitHub Release and its attestation) is widened below.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not ubuntu-latest/24.04) so release binaries link
          # against glibc 2.35 and still run on a 22.04 pilot box. CI's own
          # `checks` job stays on ubuntu-latest — this pin is release-only.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: codekurve-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: codekurve-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: codekurve-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codekurve-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release -p codekurve-bin --target ${{ matrix.target }}

      - name: rename binary to artifact name (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/codekurve ${{ matrix.artifact }}

      - name: rename binary to artifact name (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\codekurve.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  sbom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all

      - name: collect SBOM files
        run: |
          mkdir -p sbom-out
          find . -name '*.cdx.json' -exec cp {} sbom-out/ \;

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-out

  licenses:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: generate third-party NOTICE report
        run: cargo about generate about.hbs > NOTICE-3rdparty.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: NOTICE-3rdparty.md

  bundle:
    needs: [build, sbom, licenses]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: flatten artifact tree
        run: |
          mkdir -p bundle
          find dist -type f -exec cp {} bundle/ \;

      - name: generate SHA-256 checksums
        working-directory: bundle
        run: sha256sum * > SHA256SUMS

      - name: self-check checksums
        working-directory: bundle
        run: sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codekurve-release-bundle
          path: bundle

  publish:
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write # gh release create
      id-token: write # attestation signing (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codekurve-release-bundle
          path: bundle

      # Signed SLSA build provenance for every file SHA256SUMS lists. The
      # installers' checksum check only proves the download matches what the
      # release claims; this proves the release's files were built by this
      # workflow from this tag. Verify with:
      #   gh attestation verify <file> --repo luisantonio1493/codeKurve
      # Runs before `gh release create` so a release never ships without it.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: bundle/SHA256SUMS

      - name: create GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" bundle/* --generate-notes
