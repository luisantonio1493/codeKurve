name: Release

# CI-artifacts-only: this workflow builds binaries + SBOM + license report +
# checksums and uploads them as GitHub Actions workflow artifacts. It
# deliberately has NO publish step (no `gh release create`, no public
# download URL, no registry push) — see design decision D6/D7/D8 and the
# release-packaging spec's "No public distribution occurs" scenario.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not ubuntu-latest/24.04) so release binaries link
          # against glibc 2.35 and still run on a 22.04 pilot box. CI's own
          # `checks` job stays on ubuntu-latest — this pin is release-only.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: codekurve-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: codekurve-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: codekurve-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codekurve-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release -p codekurve-bin --target ${{ matrix.target }}

      - name: rename binary to artifact name (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/codekurve ${{ matrix.artifact }}

      - name: rename binary to artifact name (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\codekurve.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  sbom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all

      - name: collect SBOM files
        run: |
          mkdir -p sbom-out
          find . -name '*.cdx.json' -exec cp {} sbom-out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-out

  licenses:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: generate third-party NOTICE report
        run: cargo about generate about.hbs > NOTICE-3rdparty.md

      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: NOTICE-3rdparty.md

  bundle:
    needs: [build, sbom, licenses]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: flatten artifact tree
        run: |
          mkdir -p bundle
          find dist -type f -exec cp {} bundle/ \;

      - name: generate SHA-256 checksums
        working-directory: bundle
        run: sha256sum * > SHA256SUMS

      - name: self-check checksums
        working-directory: bundle
        run: sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: codekurve-release-bundle
          path: bundle
