name: Release

# Builds binaries + SBOM + license report + checksums, uploads them as
# GitHub Actions workflow artifacts (`bundle` job), and — only when the run
# was triggered by a `v*` tag push — publishes that same bundle as a public
# GitHub Release via `gh release create` (`publish` job). A bare
# `workflow_dispatch` run (no tag) still builds and bundles but never
# publishes, so ad-hoc runs can't accidentally cut a release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Same cargo-deny invocation and pinned action as ci.yml's `audit` job, run
  # here so a release cannot publish with a failing advisory/license/ban check.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not ubuntu-latest/24.04) so release binaries link
          # against glibc 2.35 and still run on a 22.04 pilot box. CI's own
          # `checks` job stays on ubuntu-latest — this pin is release-only.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: codekurve-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: codekurve-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: codekurve-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: codekurve-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release -p codekurve-bin --target ${{ matrix.target }}

      - name: rename binary to artifact name (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/codekurve ${{ matrix.artifact }}

      - name: rename binary to artifact name (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\codekurve.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  sbom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all

      - name: collect SBOM files
        run: |
          mkdir -p sbom-out
          find . -name '*.cdx.json' -exec cp {} sbom-out/ \;

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-out

  licenses:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: generate third-party NOTICE report
        run: cargo about generate about.hbs > NOTICE-3rdparty.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-report
          path: NOTICE-3rdparty.md

  bundle:
    needs: [build, sbom, licenses]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: flatten artifact tree
        run: |
          mkdir -p bundle
          find dist -type f -exec cp {} bundle/ \;

      - name: generate SHA-256 checksums
        working-directory: bundle
        run: sha256sum * > SHA256SUMS

      - name: self-check checksums
        working-directory: bundle
        run: sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codekurve-release-bundle
          path: bundle

  publish:
    needs: [bundle, deny]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # Only job that writes to the repository (creates the GitHub Release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codekurve-release-bundle
          path: bundle

      - name: create GitHub release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" bundle/* --generate-notes
