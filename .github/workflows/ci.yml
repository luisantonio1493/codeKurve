name: CI

on:
  push:
    # Branches only. A bare `push:` also matches tag pushes, so cutting a
    # release ran CI twice over identical bytes — once for the branch commit
    # and once for the tag pointing at it — on top of the Release workflow.
    # A tag always points at a commit CI already checked on its branch.
    branches: ["**"]
  pull_request:

# Read-only token: nothing in CI writes to the repository. Artifact upload
# uses its own runtime token and needs no `contents` scope.
permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: licensing check
        run: python scripts/check_licensing.py

      - name: agent-context benchmark runner tests
        run: python tests/test_bench_agent_context.py

      # The installers are the one shipped surface with no compiler behind it:
      # a syntax error in either would only surface on a user's machine, at
      # the exact moment they are trying to install or update. Parse-check
      # each on the platform that actually runs it.
      - name: install.sh syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: install.ps1 syntax
        if: runner.os == 'Windows'
        run: $null = [ScriptBlock]::Create((Get-Content -Raw install.ps1))

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # floating `v2` tag at pin time (not the v2.1.1 commit)
        with:
          command: check advisories licenses bans sources

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: generate third-party NOTICE report
        run: cargo about generate about.hbs > NOTICE-3rdparty.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: license-report
          path: NOTICE-3rdparty.md

# Deferred (see docs/ROADMAP.md and design decisions):
# - aarch64 Linux runner (macos-latest already covers aarch64 macOS).
# - doc-tests and a dedicated MSRV job.
# - dependency caching (no Swatinem/rust-cache in Phase 0 — auditability
#   over speed; reconsider only when build slowness is measured).
